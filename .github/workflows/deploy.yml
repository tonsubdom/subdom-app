name: Deploy to Aeza

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        working-directory: ./tma
        run: bun install

      - name: Build frontend
        working-directory: ./tma
        env:
          VITE_API_BASE_URL: https://subdom.zone
          VITE_PUBLIC_URL: https://subdom.zone
          VITE_API_SC_PAYLOAD_URL: https://api.subdom.zone
          VITE_PLATFORM_OWNER_TESTNET: ${{ vars.PLATFORM_OWNER_TESTNET }}
          VITE_NFT_WRAPPER_COLLECTION_TESTNET: ${{ vars.NFT_WRAPPER_COLLECTION_TESTNET }}
          VITE_PROXY_COLLECTION_TESTNET: ${{ vars.PROXY_COLLECTION_TESTNET }}
          VITE_PAYMENT_OWNER_TESTNET: ${{ vars.PAYMENT_OWNER_TESTNET }}
          VITE_PAYMENT_PARTNER_TESTNET: ${{ vars.PAYMENT_PARTNER_TESTNET }}
          VITE_PLATFORM_OWNER_MAINNET: ${{ vars.PLATFORM_OWNER_MAINNET }}
          VITE_NFT_WRAPPER_COLLECTION_MAINNET: ${{ vars.NFT_WRAPPER_COLLECTION_MAINNET }}
          VITE_PROXY_COLLECTION_MAINNET: ${{ vars.PROXY_COLLECTION_MAINNET }}
          VITE_PAYMENT_OWNER_MAINNET: ${{ vars.PAYMENT_OWNER_MAINNET }}
          VITE_PAYMENT_PARTNER_MAINNET: ${{ vars.PAYMENT_PARTNER_MAINNET }}
          VITE_HASH_PROXY_COLLECTION_TESTNET: ${{ vars.HASH_PROXY_COLLECTION_TESTNET }}
          VITE_HASH_SBT_COLLECTION_TESTNET: ${{ vars.HASH_SBT_COLLECTION_TESTNET }}
          VITE_HASH_NFT_WRAPPER_COLLECTION_TESTNET: ${{ vars.HASH_NFT_WRAPPER_COLLECTION_TESTNET }}
          VITE_HASH_PROXY_SUBDOMAIN_TESTNET: ${{ vars.HASH_PROXY_SUBDOMAIN_TESTNET }}
          VITE_HASH_PROXY_SUBDOMAIN_NEW_TESTNET: ${{ vars.HASH_PROXY_SUBDOMAIN_NEW_TESTNET }}
          VITE_HASH_SBT_SUBDOMAIN_TESTNET: ${{ vars.HASH_SBT_SUBDOMAIN_TESTNET }}
          VITE_HASH_NFT_WRAPPER_TESTNET: ${{ vars.HASH_NFT_WRAPPER_TESTNET }}
          VITE_HASH_PROXY_COLLECTION_MAINNET: ${{ vars.HASH_PROXY_COLLECTION_MAINNET }}
          VITE_HASH_SBT_COLLECTION_MAINNET: ${{ vars.HASH_SBT_COLLECTION_MAINNET }}
          VITE_HASH_NFT_WRAPPER_COLLECTION_MAINNET: ${{ vars.HASH_NFT_WRAPPER_COLLECTION_MAINNET }}
          VITE_HASH_PROXY_SUBDOMAIN_MAINNET: ${{ vars.HASH_PROXY_SUBDOMAIN_MAINNET }}
          VITE_HASH_PROXY_SUBDOMAIN_NEW_MAINNET: ${{ vars.HASH_PROXY_SUBDOMAIN_NEW_MAINNET }}
          VITE_HASH_SBT_SUBDOMAIN_MAINNET: ${{ vars.HASH_SBT_SUBDOMAIN_MAINNET }}
          VITE_HASH_NFT_WRAPPER_MAINNET: ${{ vars.HASH_NFT_WRAPPER_MAINNET }}
        run: bun run build

      - name: Setup SSH and deploy files
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='*.db' \
            --exclude='*.db-shm' \
            --exclude='*.db-wal' \
            --exclude='*.db.backup*' \
            --exclude='db/' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/root/subdom-deployment/

      - name: Rebuild and restart Docker containers
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /root/subdom-deployment && \
             docker stop subdom-deployment_backend_1 2>/dev/null || true && \
             docker rm subdom-deployment_backend_1 2>/dev/null || true && \
             export TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}' && \
             export TELEGRAM_OWNER_ID='${{ secrets.TELEGRAM_OWNER_ID }}' && \
             export TELEGRAM_GROUP_ID='${{ secrets.TELEGRAM_GROUP_ID }}' && \
             export PLATFORM_OWNER_TESTNET='${{ vars.PLATFORM_OWNER_TESTNET }}' && \
             export PLATFORM_OWNER_MAINNET='${{ vars.PLATFORM_OWNER_MAINNET }}' && \
             export ADMIN_JWT_SECRET='${{ secrets.ADMIN_JWT_SECRET }}' && \
             export TONCENTER_API_KEY='${{ secrets.TONCENTER_API_KEY }}' && \
             export PLATFORM_CACHE_TONCENTER_API_KEY='${{ secrets.PLATFORM_CACHE_TONCENTER_API_KEY }}' && \
             export NFT_WRAPPER_COLLECTION_TESTNET='${{ vars.NFT_WRAPPER_COLLECTION_TESTNET }}' && \
             export NFT_WRAPPER_COLLECTION_MAINNET='${{ vars.NFT_WRAPPER_COLLECTION_MAINNET }}' && \
             export HASH_PROXY_COLLECTION_TESTNET='${{ vars.HASH_PROXY_COLLECTION_TESTNET }}' && \
             export HASH_SBT_COLLECTION_TESTNET='${{ vars.HASH_SBT_COLLECTION_TESTNET }}' && \
             export HASH_NFT_WRAPPER_COLLECTION_TESTNET='${{ vars.HASH_NFT_WRAPPER_COLLECTION_TESTNET }}' && \
             export HASH_PROXY_SUBDOMAIN_TESTNET='${{ vars.HASH_PROXY_SUBDOMAIN_TESTNET }}' && \
             export HASH_PROXY_SUBDOMAIN_NEW_TESTNET='${{ vars.HASH_PROXY_SUBDOMAIN_NEW_TESTNET }}' && \
             export HASH_SBT_SUBDOMAIN_TESTNET='${{ vars.HASH_SBT_SUBDOMAIN_TESTNET }}' && \
             export HASH_NFT_WRAPPER_TESTNET='${{ vars.HASH_NFT_WRAPPER_TESTNET }}' && \
             export HASH_PROXY_COLLECTION_MAINNET='${{ vars.HASH_PROXY_COLLECTION_MAINNET }}' && \
             export HASH_SBT_COLLECTION_MAINNET='${{ vars.HASH_SBT_COLLECTION_MAINNET }}' && \
             export HASH_NFT_WRAPPER_COLLECTION_MAINNET='${{ vars.HASH_NFT_WRAPPER_COLLECTION_MAINNET }}' && \
             export HASH_PROXY_SUBDOMAIN_MAINNET='${{ vars.HASH_PROXY_SUBDOMAIN_MAINNET }}' && \
             export HASH_PROXY_SUBDOMAIN_NEW_MAINNET='${{ vars.HASH_PROXY_SUBDOMAIN_NEW_MAINNET }}' && \
             export HASH_SBT_SUBDOMAIN_MAINNET='${{ vars.HASH_SBT_SUBDOMAIN_MAINNET }}' && \
             export HASH_NFT_WRAPPER_MAINNET='${{ vars.HASH_NFT_WRAPPER_MAINNET }}' && \
             docker-compose build backend && \
             docker-compose down && \
             docker-compose up -d && \
             sleep 10 && \
             docker-compose ps"
