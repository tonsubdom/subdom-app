version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./tma/dist:/usr/share/nginx/html
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: ./subdom-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID:-}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID:-}
      - DB_PATH=/app
      # Admin-авторизация (TonProof, см. tonProof.ts/adminAuth.ts) — те же
      # публичные адреса, что уже зашиты во фронт как VITE_PLATFORM_OWNER_*
      # (не секрет), но бэкенду они тоже нужны отдельно для собственной
      # проверки владельца. ADMIN_JWT_SECRET — единственный реальный секрет
      # здесь, генерировать отдельно, не переиспользовать TELEGRAM_BOT_TOKEN.
      - PLATFORM_OWNER_TESTNET=${PLATFORM_OWNER_TESTNET:-}
      - PLATFORM_OWNER_MAINNET=${PLATFORM_OWNER_MAINNET:-}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
    networks:
      - app-network
    volumes:
      # Обе SQLite-базы (testnet и mainnet) должны жить на хосте, а не только
      # внутри слоя контейнера — иначе каждый `docker-compose build && down && up`
      # пересоздаёт контейнер с чистого образа и все записи, сделанные приложением
      # между деплоями, теряются. Раньше был смонтирован только mainnet-файл —
      # testnet-база (nft-domains.db, см. server-sqlite.ts) откатывалась на
      # состояние с последнего образа при каждом деплое.
      - ./subdom-server/nft-domains-mainnet.db:/app/nft-domains-mainnet.db
      - ./subdom-server/nft-domains.db:/app/nft-domains.db
      # NB: сознательно НЕ монтируем .db-wal/.db-shm (обе базы в WAL-режиме,
      # см. tgBot-sqlite.ts `pragma('journal_mode = WAL')`) — эти host-пути
      # никогда не существовали как файлы на сервере, и bind-mount несуществующего
      # пути создаёт на его месте директорию, из-за которой SQLite не может
      # открыть/создать WAL-файл (SQLITE_CANTOPEN, ловили в проде 2026-08-01).
      # Защита от потери WAL при передеплое — chekpoint на SIGTERM в
      # server-sqlite.ts, ему для этого volume не нужны.
networks:
  app-network:
    driver: bridge
