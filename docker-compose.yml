version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./tma/dist:/usr/share/nginx/html
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: ./subdom-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID:-}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID:-}
      - DB_PATH=/app
      # Admin-авторизация (TonProof, см. tonProof.ts/adminAuth.ts) — те же
      # публичные адреса, что уже зашиты во фронт как VITE_PLATFORM_OWNER_*
      # (не секрет), но бэкенду они тоже нужны отдельно для собственной
      # проверки владельца. ADMIN_JWT_SECRET — единственный реальный секрет
      # здесь, генерировать отдельно, не переиспользовать TELEGRAM_BOT_TOKEN.
      - PLATFORM_OWNER_TESTNET=${PLATFORM_OWNER_TESTNET:-}
      - PLATFORM_OWNER_MAINNET=${PLATFORM_OWNER_MAINNET:-}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      # Тот же класс бага, что и с TONCENTER_API_KEY/HASH_* ниже: deploy.yml
      # экспортирует эти переменные на хосте (строки export
      # NFT_WRAPPER_COLLECTION_*), но без явного проброса сюда crawler.ts
      # искал wrapper-коллекцию ТОЛЬКО по code_hash — на mainnet у владельца
      # накопилось несколько осиротевших коллекций с тем же хешем, и
      # toncenter не гарантирует порядок выдачи, поэтому .find() иногда
      # попадал не в настоящую, а в пустую (0 обёрток в Market вместо
      # реальных, диагностировано 2026-08-09).
      - NFT_WRAPPER_COLLECTION_TESTNET=${NFT_WRAPPER_COLLECTION_TESTNET:-}
      - NFT_WRAPPER_COLLECTION_MAINNET=${NFT_WRAPPER_COLLECTION_MAINNET:-}
      # platformCache-кроулер (crawler.ts) читает именно эту переменную —
      # deploy.yml экспортировал её на хосте, но забыли прокинуть в сам
      # контейнер здесь, поэтому кроулер тихо пропускал обход оба раза за
      # 15 мин (см. [platformCache] ... "не настроены в env" в логах,
      # 2026-08-06). PLATFORM_OWNER_* этот же баг не задел, они уже были
      # прописаны ниже.
      - TONCENTER_API_KEY=${TONCENTER_API_KEY:-}
      # Отдельный ключ только для кроулера (platformCache/toncenter-api-config.ts
      # берёт его с приоритетом, падая на TONCENTER_API_KEY если пусто) — не
      # делит rate limit toncenter с VITE_TONCENTER_API_KEY, которым бьют
      # напрямую браузеры всех юзеров разом (лимит у toncenter общий на ключ,
      # см. живой инцидент 2026-08-16 — под реальной параллельной нагрузкой
      # общий лимит улетал в 429 у всех сразу).
      - PLATFORM_CACHE_TONCENTER_API_KEY=${PLATFORM_CACHE_TONCENTER_API_KEY:-}
      # Тот же класс бага, что и с TONCENTER_API_KEY выше: deploy.yml
      # экспортирует эти HASH_*-переменные на хосте, но без явного
      # проброса сюда SubdomainClassifier (crawler.ts/toncenter-api-config.ts)
      # получал пустые CODE_HASHES и не признавал НИ ОДНУ реальную
      # коллекцию "нашей" зоной — кроулер стабильно находил 0 зон при
      # рабочем toncenter API (диагностировано 2026-08-08).
      - HASH_PROXY_COLLECTION_TESTNET=${HASH_PROXY_COLLECTION_TESTNET:-}
      - HASH_SBT_COLLECTION_TESTNET=${HASH_SBT_COLLECTION_TESTNET:-}
      - HASH_NFT_WRAPPER_COLLECTION_TESTNET=${HASH_NFT_WRAPPER_COLLECTION_TESTNET:-}
      - HASH_PROXY_SUBDOMAIN_TESTNET=${HASH_PROXY_SUBDOMAIN_TESTNET:-}
      - HASH_PROXY_SUBDOMAIN_NEW_TESTNET=${HASH_PROXY_SUBDOMAIN_NEW_TESTNET:-}
      - HASH_SBT_SUBDOMAIN_TESTNET=${HASH_SBT_SUBDOMAIN_TESTNET:-}
      - HASH_NFT_WRAPPER_TESTNET=${HASH_NFT_WRAPPER_TESTNET:-}
      - HASH_PROXY_COLLECTION_MAINNET=${HASH_PROXY_COLLECTION_MAINNET:-}
      - HASH_SBT_COLLECTION_MAINNET=${HASH_SBT_COLLECTION_MAINNET:-}
      - HASH_NFT_WRAPPER_COLLECTION_MAINNET=${HASH_NFT_WRAPPER_COLLECTION_MAINNET:-}
      - HASH_PROXY_SUBDOMAIN_MAINNET=${HASH_PROXY_SUBDOMAIN_MAINNET:-}
      - HASH_PROXY_SUBDOMAIN_NEW_MAINNET=${HASH_PROXY_SUBDOMAIN_NEW_MAINNET:-}
      - HASH_SBT_SUBDOMAIN_MAINNET=${HASH_SBT_SUBDOMAIN_MAINNET:-}
      - HASH_NFT_WRAPPER_MAINNET=${HASH_NFT_WRAPPER_MAINNET:-}
      # tonutils-storage (см. storage-daemon/) — POST /api/v1/create читает
      # файлы с диска по пути, не по телу запроса, поэтому backend и storage
      # должны видеть один и тот же volume storage_uploads.
      - STORAGE_API_URL=http://storage:8192
      - STORAGE_API_LOGIN=${STORAGE_API_LOGIN:-}
      - STORAGE_API_PASSWORD=${STORAGE_API_PASSWORD:-}
      - STORAGE_UPLOADS_PATH=/app/storage-uploads
    depends_on:
      - storage
    networks:
      - app-network
    volumes:
      - storage_uploads:/app/storage-uploads
      # Обе SQLite-базы (testnet и mainnet) должны жить на хосте, а не только
      # внутри слоя контейнера — иначе каждый `docker-compose build && down && up`
      # пересоздаёт контейнер с чистого образа и все записи, сделанные приложением
      # между деплоями, теряются. Раньше был смонтирован только mainnet-файл —
      # testnet-база (nft-domains.db, см. server-sqlite.ts) откатывалась на
      # состояние с последнего образа при каждом деплое.
      - ./subdom-server/nft-domains-mainnet.db:/app/nft-domains-mainnet.db
      - ./subdom-server/nft-domains.db:/app/nft-domains.db
      # .db-wal/.db-shm ТЕПЕРЬ ТОЖЕ монтируются (см. Log.md 2026-08-11) — без
      # этого свежие записи (весь platformCache-кроулер) жили только внутри
      # контейнера в WAL-режиме и были невидимы с хоста до checkpoint'а
      # (ловили вживую: dedupe-скрипт на хосте видел старую/пустую копию
      # базы, хотя приложение внутри контейнера работало с актуальными
      # данными). Раньше эти пути НЕ монтировали, потому что bind-mount
      # несуществующего host-пути создаёт на его месте директорию вместо
      # файла (SQLITE_CANTOPEN, ловили в проде 2026-08-01) — теперь на хосте
      # заранее лежат пустые файлы-плейсхолдеры под них, так что Docker
      # монтирует настоящие файлы, а не директории.
      - ./subdom-server/nft-domains-mainnet.db-wal:/app/nft-domains-mainnet.db-wal
      - ./subdom-server/nft-domains-mainnet.db-shm:/app/nft-domains-mainnet.db-shm
      - ./subdom-server/nft-domains.db-wal:/app/nft-domains.db-wal
      - ./subdom-server/nft-domains.db-shm:/app/nft-domains.db-shm
      # Checkpoint на SIGTERM в server-sqlite.ts остаётся как доп. подстраховка
      # на передеплое — теперь просто перестал быть единственной защитой.

  storage:
    build:
      context: ./storage-daemon
      dockerfile: Dockerfile
    environment:
      - STORAGE_API_LOGIN=${STORAGE_API_LOGIN:-}
      - STORAGE_API_PASSWORD=${STORAGE_API_PASSWORD:-}
    networks:
      - app-network
    volumes:
      # Общий с backend volume — DetectFileRefs в tonutils-storage читает
      # файлы по пути на диске, не по телу HTTP-запроса, так что backend
      # должен сохранить загруженный файл сюда ДО вызова /api/v1/create.
      - storage_uploads:/app/storage-uploads
      # Отдельный volume под собственное состояние демона (bags, config.json,
      # ключи ноды) — обязателен, иначе всё это создаётся заново на каждом
      # docker-compose build && down && up (тот же класс бага, что был у
      # SQLite-баз, см. выше).
      - storage_db:/data/db
    restart: always
    # NB: порт API (8192) сознательно не пробрасывается в hosts ports —
    # доступен только backend'у внутри app-network по имени "storage".

networks:
  app-network:
    driver: bridge

volumes:
  storage_uploads:
  storage_db:
