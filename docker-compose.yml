version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./tma/dist:/usr/share/nginx/html
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  backend:
    build:
      context: ./subdom-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_ID=${TELEGRAM_OWNER_ID:-}
      - TELEGRAM_GROUP_ID=${TELEGRAM_GROUP_ID:-}
      - DB_PATH=/app
      # Admin-авторизация (TonProof, см. tonProof.ts/adminAuth.ts) — те же
      # публичные адреса, что уже зашиты во фронт как VITE_PLATFORM_OWNER_*
      # (не секрет), но бэкенду они тоже нужны отдельно для собственной
      # проверки владельца. ADMIN_JWT_SECRET — единственный реальный секрет
      # здесь, генерировать отдельно, не переиспользовать TELEGRAM_BOT_TOKEN.
      - PLATFORM_OWNER_TESTNET=${PLATFORM_OWNER_TESTNET:-}
      - PLATFORM_OWNER_MAINNET=${PLATFORM_OWNER_MAINNET:-}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      # platformCache-кроулер (crawler.ts) читает именно эту переменную —
      # deploy.yml экспортировал её на хосте, но забыли прокинуть в сам
      # контейнер здесь, поэтому кроулер тихо пропускал обход оба раза за
      # 15 мин (см. [platformCache] ... "не настроены в env" в логах,
      # 2026-08-06). PLATFORM_OWNER_* этот же баг не задел, они уже были
      # прописаны ниже.
      - TONCENTER_API_KEY=${TONCENTER_API_KEY:-}
      # tonutils-storage (см. storage-daemon/) — POST /api/v1/create читает
      # файлы с диска по пути, не по телу запроса, поэтому backend и storage
      # должны видеть один и тот же volume storage_uploads.
      - STORAGE_API_URL=http://storage:8192
      - STORAGE_API_LOGIN=${STORAGE_API_LOGIN:-}
      - STORAGE_API_PASSWORD=${STORAGE_API_PASSWORD:-}
      - STORAGE_UPLOADS_PATH=/app/storage-uploads
    depends_on:
      - storage
    networks:
      - app-network
    volumes:
      - storage_uploads:/app/storage-uploads
      # Обе SQLite-базы (testnet и mainnet) должны жить на хосте, а не только
      # внутри слоя контейнера — иначе каждый `docker-compose build && down && up`
      # пересоздаёт контейнер с чистого образа и все записи, сделанные приложением
      # между деплоями, теряются. Раньше был смонтирован только mainnet-файл —
      # testnet-база (nft-domains.db, см. server-sqlite.ts) откатывалась на
      # состояние с последнего образа при каждом деплое.
      - ./subdom-server/nft-domains-mainnet.db:/app/nft-domains-mainnet.db
      - ./subdom-server/nft-domains.db:/app/nft-domains.db
      # NB: сознательно НЕ монтируем .db-wal/.db-shm (обе базы в WAL-режиме,
      # см. tgBot-sqlite.ts `pragma('journal_mode = WAL')`) — эти host-пути
      # никогда не существовали как файлы на сервере, и bind-mount несуществующего
      # пути создаёт на его месте директорию, из-за которой SQLite не может
      # открыть/создать WAL-файл (SQLITE_CANTOPEN, ловили в проде 2026-08-01).
      # Защита от потери WAL при передеплое — chekpoint на SIGTERM в
      # server-sqlite.ts, ему для этого volume не нужны.

  storage:
    build:
      context: ./storage-daemon
      dockerfile: Dockerfile
    environment:
      - STORAGE_API_LOGIN=${STORAGE_API_LOGIN:-}
      - STORAGE_API_PASSWORD=${STORAGE_API_PASSWORD:-}
    networks:
      - app-network
    volumes:
      # Общий с backend volume — DetectFileRefs в tonutils-storage читает
      # файлы по пути на диске, не по телу HTTP-запроса, так что backend
      # должен сохранить загруженный файл сюда ДО вызова /api/v1/create.
      - storage_uploads:/app/storage-uploads
      # Отдельный volume под собственное состояние демона (bags, config.json,
      # ключи ноды) — обязателен, иначе всё это создаётся заново на каждом
      # docker-compose build && down && up (тот же класс бага, что был у
      # SQLite-баз, см. выше).
      - storage_db:/data/db
    restart: always
    # NB: порт API (8192) сознательно не пробрасывается в hosts ports —
    # доступен только backend'у внутри app-network по имени "storage".

networks:
  app-network:
    driver: bridge

volumes:
  storage_uploads:
  storage_db:
